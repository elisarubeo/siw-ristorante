spring.application.name=siw-ristorante

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ristorante
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Hibernate & Logging
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Web Server & Thymeleaf
# ===============================
server.port=8080
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
# In sviluppo il browser non deve mettere in cache CSS e immagini:
# da rimuovere (o alzare) in produzione.
spring.web.resources.cache.period=0
spring.thymeleaf.encoding=UTF-8

# ===============================
# Immagini dei ristoranti
# ===============================
# Cartella in cui finiscono i file caricati, relativa alla directory da cui si
# avvia l'applicazione. Viene creata all'avvio se non esiste ed e' esclusa da
# git: le foto caricate sono dati, non codice.
app.uploads.directory=uploads/ristoranti
# Oltre questa soglia la richiesta viene respinta.
spring.servlet.multipart.max-file-size=5MB
# Piu' generoso del singolo file: la form ne accetta parecchi in una volta.
spring.servlet.multipart.max-request-size=25MB
# NOTA: superato il limite, la richiesta viene interrotta da Tomcat mentre il
# filtro CSRF sta leggendo il token dal corpo multipart, cioe' prima che Spring
# MVC scelga un controller. Nessun @ExceptionHandler puo' quindi intercettarla:
# il messaggio per l'utente sta in templates/error/413.html, che Spring Boot
# usa proprio perche' si chiama come lo stato HTTP restituito.

# ===============================
# Parte REST / React (statistiche)
# ===============================
# Segreto con cui si firmano i token. DEVE essere di almeno 32 caratteri:
# HMAC-SHA256 vuole una chiave di 256 bit e jjwt rifiuta quelle piu' corte
# all'avvio, non alla prima richiesta.
# La firma garantisce che il token non sia stato manomesso, non che sia
# segreto: il contenuto e' Base64URL e chiunque lo puo' leggere. Per questo
# dentro ci vanno solo username e ruolo, mai la password.
app.jwt.secret=siw-ristorante-chiave-di-firma-per-i-token-2026
# Durata del token, in millisecondi: 24 ore. Scaduto, si rifa il login.
app.jwt.expiration-ms=86400000

# Swagger UI: la pagina da cui si provano gli endpoint senza React.
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
