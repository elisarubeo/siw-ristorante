spring.application.name=siw-ristorante

spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ristorante
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Rete di sicurezza contro le 1+N: le associazioni LAZY che sfuggono ai fetch
# join non vengono piu' caricate una riga per volta, ma a gruppi di sedici con
# un'unica "in (...)". Non sostituisce i grafi sui repository: li copre quando
# una pagina nuova tocca qualcosa a cui nessuno aveva pensato.
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Le cancellazioni in cascata (le prenotazioni di un tavolo, le righe di
# un'ordinazione chiusa) sono una delete per riga: raggruppate in un colpo solo.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=8080
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.thymeleaf.encoding=UTF-8

app.uploads.directory=uploads/ristoranti
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=siw-ristorante-chiave-di-firma-per-i-token-2026
app.jwt.expiration-ms=900000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
