spring.application.name=siw-ristorante

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ristorante
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Hibernate & Logging
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Web Server & Thymeleaf
# ===============================
server.port=8080
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
# In sviluppo il browser non deve mettere in cache CSS e immagini:
# da rimuovere (o alzare) in produzione.
spring.web.resources.cache.period=0
spring.thymeleaf.encoding=UTF-8

# ===============================
# Parte REST / React (statistiche)
# ===============================
# Segreto con cui si firmano i token. DEVE essere di almeno 32 caratteri:
# HMAC-SHA256 vuole una chiave di 256 bit e jjwt rifiuta quelle piu' corte
# all'avvio, non alla prima richiesta.
# La firma garantisce che il token non sia stato manomesso, non che sia
# segreto: il contenuto e' Base64URL e chiunque lo puo' leggere. Per questo
# dentro ci vanno solo username e ruolo, mai la password.
app.jwt.secret=siw-ristorante-chiave-di-firma-per-i-token-2026
# Durata del token, in millisecondi: 24 ore. Scaduto, si rifa il login.
app.jwt.expiration-ms=86400000

# Swagger UI: la pagina da cui si provano gli endpoint senza React.
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
