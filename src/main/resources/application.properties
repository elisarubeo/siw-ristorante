spring.application.name=siw-ristorante

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ristorante
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Hibernate & Logging
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Web Server & Thymeleaf
# ===============================
server.port=8080
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
# In sviluppo il browser non deve mettere in cache CSS e immagini:
# da rimuovere (o alzare) in produzione.
spring.web.resources.cache.period=0
spring.thymeleaf.encoding=UTF-8
