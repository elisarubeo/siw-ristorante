<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: testa('Le mie prenotazioni')}"></head>
<body>
<header th:replace="~{fragments/layout :: intestazione(null)}"></header>

<main class="contenuto">
    <h1>Le mie prenotazioni</h1>
    <p class="sottotitolo">Le più recenti per prime.</p>

    <p class="avviso avviso-esito" th:if="${successMessage}" th:text="${successMessage}">esito</p>
    <p class="avviso avviso-errore" th:if="${errorMessage}" th:text="${errorMessage}">errore</p>

    <ul class="griglia" th:if="${!#lists.isEmpty(prenotazioni)}">
        <li class="scheda" th:each="p : ${prenotazioni}"
            th:with="annullata=${p.status.name() == 'CANCELLED'},
                     modificabile=${p.inizio.isAfter(T(java.time.LocalDateTime).now())}"
            th:classappend="${annullata} ? 'non-disponibile' : ''">

            <h2 th:text="${p.ristorante.nome}">Nome del ristorante</h2>

            <p class="indirizzo">
                <!-- Le date si formattano qui e non nel model: la pagina decide
                     come mostrarle, il dominio si limita a conservarle. -->
                <span th:text="${#temporals.format(p.dataPrenotazione, 'dd/MM/yyyy')}">01/01/2026</span>
                alle
                <span th:text="${#temporals.format(p.orarioPrenotazione, 'HH:mm')}">20:00</span>
            </p>

            <p class="indirizzo">
                Tavolo <span th:text="${p.tavolo.numeroTavolo}">1</span> ·
                <span th:text="${p.numeroPersone}">2</span> persone ·
                <span th:text="${p.durataMinuti} + ' minuti'">120 minuti</span>
            </p>

            <!-- Nessuna etichetta per le prenotazioni valide: l'etichetta
                 segnala un'eccezione, non lo stato normale delle cose. -->
            <p class="azione" th:if="${annullata}">
                <span class="etichetta">annullata</span>
            </p>

            <!-- Si modifica e si annulla solo cio' che e' ancora futuro. -->
            <div class="azioni-piatto" th:if="${!annullata and modificabile}">
                <a class="bottone bottone-tenue"
                   th:href="@{/prenotazioni/{p}/edit(p=${p.id})}">Modifica</a>
                <form th:action="@{/prenotazioni/{p}/cancel(p=${p.id})}" method="post"
                      onsubmit="return confirm('Annullare questa prenotazione?')">
                    <button type="submit" class="bottone bottone-tenue">Annulla</button>
                </form>
            </div>
        </li>
    </ul>

    <div class="vuoto" th:if="${#lists.isEmpty(prenotazioni)}">
        Non hai ancora prenotato nessun tavolo.
        <p style="margin-bottom:0"><a th:href="@{/ristoranti}">Scegli un ristorante</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: chiusura}"></footer>
</body>
</html>
