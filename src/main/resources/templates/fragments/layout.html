<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="testa(titolo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titolo} + ' · Ristorante'">Ristorante</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header th:fragment="intestazione(idGestione)" class="intestazione">
    <div class="barra"
         th:with="autenticato=${#authentication != null and #authentication.name != 'anonymousUser'},
                  cliente=${#authentication != null
                            and !#authentication.authorities.?[authority == 'DEFAULT'].isEmpty()},
                  ristoratore=${#authentication != null
                            and !#authentication.authorities.?[authority == 'RISTORATORE'].isEmpty()},
                  amministratore=${#authentication != null
                            and !#authentication.authorities.?[authority == 'ADMIN'].isEmpty()},
                  idLocale=${mioRistoranteId != null ? mioRistoranteId : idGestione}">
        <a class="marchio" th:href="${ristoratore} ? @{/mio-ristorante} : @{/}">Ristorante</a>
        <nav class="navigazione">
            <a th:unless="${autenticato}" th:href="@{/login}">Accedi</a>

            <a th:if="${cliente}" th:href="@{/prenotazioni}">Le mie prenotazioni</a>
            <a th:if="${amministratore}" th:href="@{/admin/ristoranti}">Gestione ristoranti</a>

            <th:block th:if="${ristoratore}">
                <th:block th:if="${idLocale != null}">
                    <a th:href="@{/ristoranti/{id}/ordinazioni(id=${idLocale})}">Conti aperti</a>
                    <a th:href="@{/ristoranti/{id}/scontrini(id=${idLocale})}">Scontrini</a>
                    <a th:href="@{/ristoranti/{id}/agenda(id=${idLocale})}">Agenda</a>
                </th:block>
                <a th:href="@{/statistiche/}">Statistiche</a>
                <a th:href="@{/ristoranti}">Tutti i ristoranti</a>
            </th:block>

            <span th:if="${autenticato}" class="utente">
                <span th:text="${#authentication.name}">utente</span>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="bottone bottone-tenue">Esci</button>
                </form>
            </span>
        </nav>
    </div>
</header>

<footer th:fragment="chiusura" class="chiusura">
    <div>Progetto SIW · Universita degli Studi Roma Tre</div>
</footer>

</body>
</html>
