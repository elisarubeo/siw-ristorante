<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: testa('Conto')}"></head>
<body>
<header th:replace="~{fragments/layout :: intestazione}"></header>

<!-- Un'ordinazione esiste solo finche' il conto e' aperto: alla chiusura
     diventa uno scontrino e sparisce. Non c'e' nessuno stato da mostrare,
     perche' un conto chiuso non arriva mai fino a questa pagina. -->
<main class="contenuto">
    <a class="ritorno" th:href="@{/ristoranti/{id}/tavoli(id=${ristorante.id})}">&larr; Torna ai tavoli</a>

    <p class="avviso avviso-esito" th:if="${successMessage}" th:text="${successMessage}">esito</p>
    <p class="avviso avviso-errore" th:if="${errorMessage}" th:text="${errorMessage}">errore</p>

    <h1 class="titolo-con-etichetta">
        <span th:text="'Tavolo ' + ${ordinazione.tavolo.numeroTavolo}">Tavolo 1</span>
        <span class="etichetta etichetta-occupato">aperto</span>
    </h1>

    <p class="sottotitolo">
        <span th:text="${ristorante.nome}">Nome del ristorante</span> &middot;
        aperto il
        <span th:text="${#temporals.format(ordinazione.apertura, 'dd/MM/yyyy')}">01/01/2026</span>
        alle
        <span th:text="${#temporals.format(ordinazione.apertura, 'HH:mm')}">20:00</span>
    </p>

    <!-- La tabella scorre da sola sugli schermi stretti invece di allargare
         tutta la pagina. -->
    <div class="tabella-scorrevole" th:if="${!#lists.isEmpty(ordinazione.righe)}">
        <table class="conto">
            <thead>
                <tr>
                    <th scope="col">Piatto</th>
                    <th scope="col" class="numerica">Qta</th>
                    <th scope="col" class="numerica">Prezzo</th>
                    <th scope="col" class="numerica">Importo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="riga : ${ordinazione.righe}">
                    <td th:text="${riga.piatto.nome}">Nome del piatto</td>
                    <td class="numerica" th:text="${riga.quantita}">1</td>
                    <!-- formatDecimal(numero, cifre intere minime, separatore
                         migliaia, decimali, separatore decimale) -->
                    <td class="numerica"
                        th:text="${#numbers.formatDecimal(riga.prezzoUnitario, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</td>
                    <td class="numerica"
                        th:text="${#numbers.formatDecimal(riga.importo, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="3">Totale</th>
                    <td class="numerica"
                        th:text="${#numbers.formatDecimal(ordinazione.totale, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Il conto ha voci: si chiude, e la chiusura emette lo scontrino. POST,
         perche' e' l'operazione che incassa, e con conferma perche' non si
         torna indietro: l'ordinazione dopo non esiste piu'. -->
    <form th:if="${!#lists.isEmpty(ordinazione.righe)}" class="azioni-conto"
          th:action="@{/ristoranti/{r}/ordinazioni/{o}/chiudi(r=${ristorante.id},o=${ordinazione.id})}"
          method="post"
          th:data-totale="${#numbers.formatDecimal(ordinazione.totale, 1, 'POINT', 2, 'COMMA')}"
          onsubmit="return confirm('Chiudere il conto e emettere lo scontrino da ' + this.dataset.totale + ' euro?')">
        <button type="submit" class="bottone">Chiudi il conto</button>
    </form>

    <!-- Il conto e' vuoto: si annulla, non si chiude. Appena ha una voce il
         pulsante sparisce, perche' da li' in poi e' una vendita e va incassata.
         POST, non collegamento: cancella qualcosa. -->
    <div class="vuoto" th:if="${#lists.isEmpty(ordinazione.righe)}">
        Il conto e aperto ma non c e ancora niente sopra.
        <form style="margin-top:1rem"
              th:action="@{/ristoranti/{r}/ordinazioni/{o}/annulla(r=${ristorante.id},o=${ordinazione.id})}"
              method="post"
              onsubmit="return confirm('Annullare l apertura di questo conto?')">
            <button type="submit" class="bottone bottone-tenue">Annulla apertura</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: chiusura}"></footer>
</body>
</html>
