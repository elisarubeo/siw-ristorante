<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: testa('Conti aperti')}"></head>
<body>
<header th:replace="~{fragments/layout :: intestazione}"></header>

<main class="contenuto">
    <a class="ritorno" th:href="@{/ristoranti/{id}/tavoli(id=${ristorante.id})}">&larr; Torna ai tavoli</a>

    <p class="avviso avviso-esito" th:if="${successMessage}" th:text="${successMessage}">esito</p>
    <p class="avviso avviso-errore" th:if="${errorMessage}" th:text="${errorMessage}">errore</p>

    <p>
        <a class="bottone bottone-tenue"
           th:href="@{/ristoranti/{id}/scontrini(id=${ristorante.id})}">Scontrini</a>
    </p>

    <h1>Conti aperti</h1>
    <p class="sottotitolo">
        <span th:text="${ristorante.nome}">Nome del ristorante</span> &middot;
        i tavoli con gente seduta adesso, in ordine di apertura.
    </p>

    <ul class="griglia" th:if="${!#lists.isEmpty(ordinazioni)}">
        <li class="scheda" th:each="o : ${ordinazioni}">
            <h2 th:text="'Tavolo ' + ${o.tavolo.numeroTavolo}">Tavolo 1</h2>

            <p class="indirizzo">
                Aperto alle
                <span th:text="${#temporals.format(o.apertura, 'HH:mm')}">20:00</span>
                &middot;
                <span th:text="${#lists.size(o.righe)}">0</span>
                <span th:text="${#lists.size(o.righe) == 1} ? 'voce' : 'voci'">voci</span>
            </p>

            <p class="indirizzo prezzo"
               th:text="${#numbers.formatDecimal(o.totale, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</p>

            <p class="azione">
                <a class="bottone bottone-tenue"
                   th:href="@{/ristoranti/{r}/ordinazioni/{o}(r=${ristorante.id},o=${o.id})}">Vai al conto</a>
            </p>
        </li>
    </ul>

    <div class="vuoto" th:if="${#lists.isEmpty(ordinazioni)}">
        Nessun conto aperto in questo momento.
        <p style="margin-bottom:0">
            <a th:href="@{/ristoranti/{id}/tavoli(id=${ristorante.id})}">Apri un conto dai tavoli</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: chiusura}"></footer>
</body>
</html>
