<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: testa('Tavoli')}"></head>
<body>
<header th:replace="~{fragments/layout :: intestazione}"></header>

<main class="contenuto">
    <a class="ritorno" th:href="@{/ristoranti/{id}/menu(id=${ristorante.id})}">&larr; Torna al menu</a>

    <!-- I flash attribute sopravvivono a un solo redirect: dopo
         l'eliminazione arrivano qui e poi spariscono. -->
    <p class="avviso avviso-esito" th:if="${successMessage}" th:text="${successMessage}">esito</p>
    <p class="avviso avviso-errore" th:if="${errorMessage}" th:text="${errorMessage}">errore</p>

    <h1>Tavoli</h1>
    <p class="sottotitolo" th:text="${ristorante.nome}">Nome del ristorante</p>

    <p class="azioni-piatto">
        <a class="bottone" th:href="@{/ristoranti/{id}/tavoli/new(id=${ristorante.id})}">Aggiungi un tavolo</a>
        <a class="bottone bottone-tenue"
           th:href="@{/ristoranti/{id}/ordinazioni(id=${ristorante.id})}">Conti aperti</a>
        <a class="bottone bottone-tenue"
           th:href="@{/ristoranti/{id}/scontrini(id=${ristorante.id})}">Scontrini</a>
        <a class="bottone bottone-tenue"
           th:href="@{/ristoranti/{id}/agenda(id=${ristorante.id})}">Agenda prenotazioni</a>
        <!-- Fuori dall'applicazione Thymeleaf: le statistiche sono la parte
             REST/React, servita come pagina a se'. Percio' non c'e' nessun id
             nell'indirizzo (il locale lo ricava il server dal token) e il
             collegamento non porta con se' la sessione: la SPA chiede un
             accesso suo, perche' l'autenticazione di la' e' a token e non a
             cookie. -->
        <a class="bottone bottone-tenue" th:href="@{/statistiche/}">Statistiche</a>
    </p>

    <!-- I tavoli arrivano gia' ordinati per numero di tavolo dal repository -->
    <ul class="griglia" th:if="${!#lists.isEmpty(tavoli)}">
        <!-- Il conto aperto del tavolo, o null se il tavolo e' libero: e' lui a
             dire se il tavolo e' occupato, non Tavolo.status. -->
        <li class="scheda" th:each="tavolo : ${tavoli}"
            th:with="conto=${contiAperti.get(tavolo.id)}">

            <h2 class="titolo-con-etichetta">
                <span th:text="'Tavolo ' + ${tavolo.numeroTavolo}">Tavolo 1</span>
                <span class="etichetta etichetta-occupato" th:if="${conto != null}">occupato</span>
            </h2>

            <p class="indirizzo" th:text="${tavolo.numeroPosti} + ' posti'">4 posti</p>

            <!-- Riepilogo del conto in corso: quanto dura e a quanto sta. -->
            <p class="indirizzo" th:if="${conto != null}">
                Aperto alle
                <span th:text="${#temporals.format(conto.apertura, 'HH:mm')}">20:00</span>
                &middot;
                <span class="prezzo"
                      th:text="${#numbers.formatDecimal(conto.totale, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</span>
            </p>

            <div class="azioni-piatto azione">
                <!-- Tavolo libero: aprire il conto e' una POST, non un
                     collegamento, perche' crea qualcosa. Nessun campo da
                     compilare: apertura, totale e tavolo li decide il server.
                     Il token CSRF lo aggiunge Thymeleaf perche' c'e' th:action. -->
                <form th:if="${conto == null}"
                      th:action="@{/ristoranti/{r}/tavoli/{t}/ordinazione(r=${ristorante.id},t=${tavolo.id})}"
                      method="post">
                    <button type="submit" class="bottone bottone-tenue">Apri conto</button>
                </form>

                <!-- Tavolo occupato: il conto esiste gia', si va a leggerlo.
                     Questa e' una GET perche' non modifica niente. -->
                <a th:if="${conto != null}" class="bottone bottone-tenue"
                   th:href="@{/ristoranti/{r}/ordinazioni/{o}(r=${ristorante.id},o=${conto.id})}">Vai al conto</a>

                <!-- Le prenotazioni di questo tavolo: una GET, non modifica niente. -->
                <a class="bottone bottone-tenue"
                   th:href="@{/ristoranti/{r}/tavoli/{t}/prenotazioni(r=${ristorante.id},t=${tavolo.id})}">Prenotazioni</a>

                <!-- L'eliminazione e' una POST, non un collegamento: le GET non
                     devono modificare niente. Il pulsante resta anche sui tavoli
                     occupati: e' il servizio a rifiutare, spiegando perche'. -->
                <form th:action="@{/ristoranti/{r}/tavoli/{t}/delete(r=${ristorante.id},t=${tavolo.id})}"
                      method="post"
                      th:data-numero="${tavolo.numeroTavolo}"
                      onsubmit="return confirm('Eliminare il tavolo ' + this.dataset.numero + '?')">
                    <button type="submit" class="bottone bottone-tenue">Elimina</button>
                </form>
            </div>
        </li>
    </ul>

    <div class="vuoto" th:if="${#lists.isEmpty(tavoli)}">
        Questo ristorante non ha ancora nessun tavolo.
    </div>
</main>

<footer th:replace="~{fragments/layout :: chiusura}"></footer>
</body>
</html>
