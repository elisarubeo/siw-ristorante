<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: testa('Menu')}"></head>
<body>
<header th:replace="~{fragments/layout :: intestazione}"></header>

<main class="contenuto">
    <a class="ritorno" th:href="@{/ristoranti}">&larr; Tutti i ristoranti</a>

    <h1 th:text="${ristorante.nome}">Nome del ristorante</h1>
    <p class="sottotitolo" th:text="${ristorante.indirizzo}">Indirizzo</p>

    <!-- I flash attribute sopravvivono a un solo redirect: dopo
         l'eliminazione arrivano qui e poi spariscono. -->
    <p class="avviso avviso-esito" th:if="${successMessage}" th:text="${successMessage}">esito</p>
    <p class="avviso avviso-errore" th:if="${errorMessage}" th:text="${errorMessage}">errore</p>

    <p th:if="${#authentication != null
               and !#authentication.authorities.?[authority == 'DEFAULT'].isEmpty()}">
        <a class="bottone" th:href="@{/ristoranti/{id}/prenotazioni/new(id=${ristorante.id})}">Prenota un tavolo</a>
    </p>

    <!-- Nascondere il pulsante e' cortesia verso l'utente, non sicurezza: a
         proteggere l'indirizzo e' la regola /ristoranti/** nella
         SecurityConfiguration. La selezione ?[...] filtra le authorities. -->
    <p th:if="${#authentication != null
               and !#authentication.authorities.?[authority == 'ADMIN'].isEmpty()}">
        <a class="bottone" th:href="@{/ristoranti/{id}/piatti/new(id=${ristorante.id})}">Aggiungi un piatto</a>
        <a class="bottone bottone-tenue" th:href="@{/ristoranti/{id}/tavoli(id=${ristorante.id})}">Gestisci i tavoli</a>
        <a class="bottone bottone-tenue" th:href="@{/ristoranti/{id}/ordinazioni(id=${ristorante.id})}">Conti aperti</a>
        <a class="bottone bottone-tenue" th:href="@{/ristoranti/{id}/scontrini(id=${ristorante.id})}">Scontrini</a>
        <a class="bottone bottone-tenue" th:href="@{/ristoranti/{id}/agenda(id=${ristorante.id})}">Agenda prenotazioni</a>
    </p>

    <!-- L'espressione sulle authorities si valuta una volta sola qui, non a
         ogni piatto. -->
    <ul class="piatti" th:if="${!#lists.isEmpty(menu)}"
        th:with="admin=${#authentication != null
                         and !#authentication.authorities.?[authority == 'ADMIN'].isEmpty()}">
        <li th:each="piatto : ${menu}" th:classappend="${piatto.disponibile} ? '' : 'non-disponibile'">
            <div class="piatto-riga">
                <span class="piatto-nome" th:text="${piatto.nome}">Nome del piatto</span>
                <span class="etichetta" th:unless="${piatto.disponibile}">non disponibile</span>
                <span class="puntini"></span>
                <!-- formatDecimal(numero, cifre intere minime, separatore
                     migliaia, decimali, separatore decimale): due decimali e
                     la virgola come si usa in italiano -->
                <span class="prezzo"
                      th:text="${#numbers.formatDecimal(piatto.prezzo, 1, 'POINT', 2, 'COMMA')} + ' &euro;'">0,00 &euro;</span>
            </div>
            <p class="ingredienti" th:text="${piatto.ingredienti}">Ingredienti</p>

            <!-- Le azioni sono POST e non collegamenti: una GET non deve
                 modificare niente, e con th:action Thymeleaf aggiunge da se' il
                 token CSRF. Fa eccezione "Modifica", che apre solo un modulo. -->
            <div class="azioni-piatto" th:if="${admin}">
                <a class="bottone bottone-tenue"
                   th:href="@{/ristoranti/{r}/piatti/{p}/edit(r=${ristorante.id},p=${piatto.id})}">Modifica</a>

                <form th:if="${piatto.disponibile}"
                      th:action="@{/ristoranti/{r}/piatti/{p}/deactivate(r=${ristorante.id},p=${piatto.id})}"
                      method="post">
                    <button type="submit" class="bottone bottone-tenue">Disattiva</button>
                </form>

                <form th:unless="${piatto.disponibile}"
                      th:action="@{/ristoranti/{r}/piatti/{p}/activate(r=${ristorante.id},p=${piatto.id})}"
                      method="post">
                    <button type="submit" class="bottone bottone-tenue">Riattiva</button>
                </form>

                <!-- Il nome passa da un attributo data- e non dentro th:onsubmit:
                     negli attributi th:on* Thymeleaf accetta solo numeri e
                     booleani, per non far finire testo arbitrario dentro il
                     JavaScript della pagina. -->
                <form th:action="@{/ristoranti/{r}/piatti/{p}/delete(r=${ristorante.id},p=${piatto.id})}"
                      method="post"
                      th:data-nome="${piatto.nome}"
                      onsubmit="return confirm('Eliminare ' + this.dataset.nome + ' dal menu?')">
                    <button type="submit" class="bottone bottone-tenue">Elimina</button>
                </form>
            </div>
        </li>
    </ul>

    <div class="vuoto" th:if="${#lists.isEmpty(menu)}">
        Il menu di questo ristorante non e ancora disponibile.
    </div>
</main>

<footer th:replace="~{fragments/layout :: chiusura}"></footer>
</body>
</html>
